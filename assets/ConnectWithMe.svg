<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 80" width="100%" height="80">
  <defs>
    <!-- Shifting Gradient for Text -->
    <linearGradient id="bell-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe100" />
      <stop offset="100%" stop-color="#ffb300" />
    </linearGradient>
    
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#89b4fa" />
      <stop offset="50%" stop-color="#a6e3a1" />
      <stop offset="100%" stop-color="#f9e2af" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800&amp;display=swap');
    
    .title-text {
      font-family: 'Outfit', 'Segoe UI', sans-serif;
      font-weight: 800;
      font-size: 28px;
      fill: url(#text-grad);
      letter-spacing: 2px;
      filter: url(#shadow);
    }
    
    /* Bell Ringing/Rocking Animation */
    @keyframes bell-ring {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(15deg); }
      40% { transform: rotate(-12deg); }
      60% { transform: rotate(8deg); }
      80% { transform: rotate(-5deg); }
    }
    
    .dora-bell {
      animation: bell-ring 4s ease-in-out infinite;
      transform-origin: 30px 40px; /* Center of the bell group */
      filter: url(#shadow);
    }
    
    /* Floating Star Animations */
    @keyframes float-star {
      0%, 100% { transform: translateY(0) scale(0.8); opacity: 0.5; }
      50% { transform: translateY(-4px) scale(1.1); opacity: 1; }
    }
    .star-1 {
      animation: float-star 2s ease-in-out infinite;
      transform-origin: 480px 30px;
    }
    .star-2 {
      animation: float-star 2.5s ease-in-out infinite -0.5s;
      transform-origin: 90px 50px;
    }
  </style>

  <!-- Doraemon Whiskers (Left and Right sides of the banner) -->
  <!-- Left Whiskers -->
  <g stroke="#89b4fa" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <line x1="80" y1="35" x2="110" y2="30" />
    <line x1="75" y1="42" x2="115" y2="42" />
    <line x1="80" y1="49" x2="110" y2="54" />
  </g>
  <!-- Right Whiskers -->
  <g stroke="#89b4fa" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <line x1="490" y1="35" x2="520" y2="30" transform="scale(-1, 1) translate(-600, 0)" />
    <line x1="485" y1="42" x2="525" y2="42" transform="scale(-1, 1) translate(-600, 0)" />
    <line x1="490" y1="49" x2="520" y2="54" transform="scale(-1, 1) translate(-600, 0)" />
  </g>

  <!-- The Group with Bell and Text (Centered) -->
  <g transform="translate(130, 0)">
    <!-- Doraemon Collar Line -->
    <path d="M -20,42 L 0,42" stroke="#f38ba8" stroke-width="4" stroke-linecap="round" filter="url(#shadow)"/>
    
    <!-- Animated Doraemon Bell Icon -->
    <g class="dora-bell" transform="translate(10, 15)">
      <!-- Bell Body -->
      <circle cx="20" cy="25" r="16" fill="url(#bell-grad)" stroke="#ffb300" stroke-width="1.5"/>
      <!-- Bell Stripe -->
      <path d="M 5,20 L 35,20" stroke="#444" stroke-width="2" stroke-linecap="round" />
      <path d="M 4,23 L 36,23" stroke="#444" stroke-width="1" stroke-linecap="round" />
      <!-- Bell Sound Hole -->
      <circle cx="20" cy="28" r="4" fill="#333" />
      <line x1="20" y1="32" x2="20" y2="40" stroke="#333" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Heading Text -->
    <text x="65" y="49" class="title-text">CONNECT WITH ME</text>
  </g>

  <!-- Twinkling Sparkles / Stars -->
  <!-- Star Left -->
  <g class="star-2" transform="translate(90, 50)">
    <path d="M 0,-4 L 1,-1 L 4,0 L 1,1 L 0,4 L -1,1 L -4,0 L -1,-1 Z" fill="#ffe100" />
  </g>
  <!-- Star Right -->
  <g class="star-1" transform="translate(480, 25)">
    <path d="M 0,-5 L 1.2,-1.2 L 5,0 L 1.2,1.2 L 0,5 L -1.2,1.2 L -5,0 L -1.2,-1.2 Z" fill="#89b4fa" />
  </g>
</svg>
