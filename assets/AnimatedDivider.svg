<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 4" width="100%" height="4">
  <defs>
    <linearGradient id="div-grad" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#89b4fa" />
      <stop offset="25%" stop-color="#cba6f7" />
      <stop offset="50%" stop-color="#f38ba8" />
      <stop offset="75%" stop-color="#f9e2af" />
      <stop offset="100%" stop-color="#89b4fa" />
    </linearGradient>
  </defs>
  <style>
    .divider-line {
      fill: url(#div-grad);
      animation: shift-grad 5s linear infinite;
    }
    @keyframes shift-grad {
      0% { transform: translateX(0); }
      100% { transform: translateX(-500px); }
    }
  </style>
  <rect class="divider-line" width="2400" height="4" rx="2" />
</svg>
