<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 195" width="495" height="195">
  <defs>
    <radialGradient id="current-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f38ba8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e1e2e" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Outfit:wght@600;800&amp;display=swap');
    
    .background {
      fill: #1e1e2e;
      rx: 10px;
    }
    .stat-label {
      font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #89b4fa;
      letter-spacing: 0.5px;
    }
    .stat-value {
      font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 30px;
      fill: #cdd6f4;
    }
    .stat-date {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 11px;
      fill: #a6adc8;
    }
    .divider {
      stroke: #313244;
      stroke-width: 1px;
      opacity: 0.8;
    }
    
    @keyframes fire-glow {
      0%, 100% { filter: drop-shadow(0 0 2px #f38ba866); transform: scale(1); }
      50% { filter: drop-shadow(0 0 6px #f38ba8aa); transform: scale(1.08); }
    }
    .fire-icon {
      animation: fire-glow 2s infinite ease-in-out;
      transform-origin: 12px 12px;
    }
  </style>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Radial Glow behind Current Streak -->
  <rect x="166" y="10" width="163" height="175" fill="url(#current-glow)" rx="8" />

  <!-- Divider Lines -->
  <line class="divider" x1="165" y1="30" x2="165" y2="165" />
  <line class="divider" x1="330" y1="30" x2="330" y2="165" />

  <!-- COLUMN 1: Total Contributions -->
  <g transform="translate(70.5, 35)" stroke="#89b4fa">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="20" x2="18" y2="10" />
      <line x1="12" y1="20" x2="12" y2="4" />
      <line x1="6" y1="20" x2="6" y2="14" />
    </svg>
  </g>
  <text x="82.5" y="82" class="stat-label" text-anchor="middle">TOTAL CONTRIBUTIONS</text>
  <text x="82.5" y="125" class="stat-value" text-anchor="middle">551</text>
  <text x="82.5" y="155" class="stat-date" text-anchor="middle">Last 365 Days</text>

  <!-- COLUMN 2: Current Streak -->
  <g class="fire-icon" transform="translate(235.5, 35)" stroke="#f38ba8">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" />
    </svg>
  </g>
  <text x="247.5" y="82" class="stat-label" text-anchor="middle">CURRENT STREAK</text>
  <text x="247.5" y="125" class="stat-value" text-anchor="middle" fill="#f38ba8">2</text>
  <text x="247.5" y="155" class="stat-date" text-anchor="middle">Jun 2 - Jun 3</text>

  <!-- COLUMN 3: Longest Streak -->
  <g transform="translate(400.5, 35)" stroke="#f9e2af">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" />
      <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" />
      <path d="M4 22h16" />
      <path d="M10 14.66V17c0 .55-.45 1-1 1H4v2h16v-2h-5c-.55 0-1-.45-1-1v-2.34" />
      <path d="M12 2a6 6 0 0 1 6 6v5a6 6 0 0 1-6 6 6 6 0 0 1-6-6V8a6 6 0 0 1 6-6z" />
    </svg>
  </g>
  <text x="412.5" y="82" class="stat-label" text-anchor="middle">LONGEST STREAK</text>
  <text x="412.5" y="125" class="stat-value" text-anchor="middle">4</text>
  <text x="412.5" y="155" class="stat-date" text-anchor="middle">Oct 11 - Oct 14</text>
</svg>
